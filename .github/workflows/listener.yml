# PulseK12 Newsletter Reply Listener
# Monitors for email replies and generates final newsletter
# Runs every 15 minutes from Friday 12pm CST through Saturday midnight CST (36 hour window)

name: Reply Listener

on:
  schedule:
    # Friday 18:00-23:59 UTC (12pm-6pm CST)
    - cron: '*/15 18-23 * * 5'
    # Saturday all day UTC (Saturday CST)
    - cron: '*/15 0-23 * * 6'
    # Sunday 00:00-05:59 UTC (Saturday 6pm-midnight CST)
    - cron: '*/15 0-5 * * 0'

  # Allow manual trigger for testing
  workflow_dispatch:

concurrency:
  group: pulse-newsletter
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: python -m unittest discover -s tests -q

      - name: Check for summaries file
        id: check_summaries
        run: |
          echo "Checking for summaries file..."
          echo "Current directory: $(pwd)"
          echo "Data directory contents:"
          ls -la data/ 2>/dev/null || echo "  data/ directory does not exist"
          echo ""
          if [ -f "data/latest_summaries.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Summaries file found"
            echo "File info:"
            ls -la data/latest_summaries.json
            echo "Generated at: $(jq -r '.generated_at // "unknown"' data/latest_summaries.json)"
            echo "Article count: $(jq -r '.count // 0' data/latest_summaries.json)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✗ No summaries file found at data/latest_summaries.json"
            echo "This means the weekly digest has not run yet, or failed to commit."
            echo "Check the 'Weekly Newsletter Digest' workflow for recent runs."
          fi

      - name: Run listener
        # Always run - URL submissions work without summaries file
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
        run: |
          python -u -m src.listener

      - name: Persist editor feedback
        if: always()
        run: |
          if [ -f data/editor_feedback.json ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -- data/editor_feedback.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist newsletter editor feedback"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Back up editor feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-feedback-${{ github.run_id }}
          path: data/editor_feedback.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Skip notification
        if: steps.check_summaries.outputs.exists == 'false'
        run: |
          echo "::warning::No summaries file found. The weekly digest must run first to generate the menu."
          echo "::notice::To fix: Run the 'Weekly Newsletter Digest' workflow manually, or wait for Friday 12pm CST."
